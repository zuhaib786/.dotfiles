# vim:fileencoding=utf-8:foldmethod=marker

# Font settings
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 28.0
adjust_line_height 108%
font_features none

# Cursor
cursor_blink_interval 0

# Window
hide_window_decorations titlebar-only

# Misc
macos_option_as_alt yes

# Theme: cmd+shift+l toggles light (dayfox) / dark (teal-night).
# The schedule (sunrise -> light, sunset -> dark) runs from launchd; see ~/.local/bin/theme
map cmd+shift+l launch --type=background /Users/zuhaib/.local/bin/theme toggle

# Theme (rewritten by ~/.local/bin/theme)
include current-theme.conf
