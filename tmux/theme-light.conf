# dayfox (light) — sourced by ~/.tmux.conf and by ~/.local/bin/theme
# window-style bg matches kitty so tmux reports the right background to apps (Claude Code "auto")
set -g window-style "bg=#f6f2ee"
set -g window-active-style "bg=#f6f2ee"
set -g status-style "bg=#e4dcd4,fg=#3d2b5a"
set -g pane-border-style "fg=#d3c7bb"
set -g pane-active-border-style "fg=#287980"
set -g message-style "bg=#dbd1dd,fg=#2848a9"
set -g message-command-style "bg=#dbd1dd,fg=#2848a9"
set -g mode-style "bg=#e7d2be,fg=#3d2b5a"
set -g status-left "#[bg=#d3c7bb,fg=#287980,bold] #S #[bg=#e4dcd4,fg=#aab0ad] "
set -g status-right "#[fg=#837a72]%Y-%m-%d #[fg=#287980,bold]%H:%M "
setw -g window-status-format "#[fg=#837a72] #I:#W "
setw -g window-status-current-format "#[bg=#e7d2be,fg=#2848a9,bold] #I:#W "
setw -g window-status-activity-style "fg=#ac5402"
