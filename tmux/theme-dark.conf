# teal-night (dark) — sourced by ~/.tmux.conf and by ~/.local/bin/theme
# window-style bg matches kitty so tmux reports the right background to apps (Claude Code "auto")
set -g window-style "bg=#0f1e2d"
set -g window-active-style "bg=#0f1e2d"
set -g status-style "bg=#10202f,fg=#c7d7e6"
set -g pane-border-style "fg=#22384c"
set -g pane-active-border-style "fg=#4fd6b8"
set -g message-style "bg=#16283a,fg=#7adcf0"
set -g message-command-style "bg=#16283a,fg=#7adcf0"
set -g mode-style "bg=#1e3a52,fg=#e4eef8"
set -g status-left "#[bg=#16283a,fg=#4fd6b8,bold] #S #[bg=#10202f,fg=#2f4a63] "
set -g status-right "#[fg=#55708a]%Y-%m-%d #[fg=#4fd6b8,bold]%H:%M "
setw -g window-status-format "#[fg=#55708a] #I:#W "
setw -g window-status-current-format "#[bg=#1e3a52,fg=#7adcf0,bold] #I:#W "
setw -g window-status-activity-style "fg=#e8d48a"
