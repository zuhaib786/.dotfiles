# Minimal tmux config for Python/C++ development.

# Terminal and shell behavior
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Usability
set -g mouse on
setw -g mode-keys vi
set -g set-clipboard on

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Splits open in the current pane's directory
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows open in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# Copy mode: v to select, y to copy.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Quick project layouts
bind P split-window -v -p 30 -c "#{pane_current_path}" \; split-window -h -c "#{pane_current_path}" \; select-pane -t 1
bind C split-window -h -p 35 -c "#{pane_current_path}" \; split-window -v -c "#{pane_current_path}" \; select-pane -t 1

# Status line layout
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 80

# Colours: dark = teal-night, light = dayfox. ~/.local/bin/theme switches them live.
if-shell '[ "$(cat ~/.local/state/theme/mode 2>/dev/null)" = light ]' \
  'source-file ~/.config/tmux/theme-light.conf' \
  'source-file ~/.config/tmux/theme-dark.conf'

# Hide tmux's status line while the active pane is Vim/Neovim.
set-hook -g pane-focus-in 'if -F "#{||:#{==:#{pane_current_command},nvim},#{==:#{pane_current_command},vim}}" "set-option status off" "set-option status on"'
